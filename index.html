<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#064e3b">
<link rel="manifest" href="manifest.json">
<title>FTL Workout</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07110d;color:#f5f5f5;font-family:Arial,sans-serif}
.wrap{max-width:760px;margin:auto;padding:14px}h1{margin:0;font-size:23px}.sub{color:#aeb9b3;font-size:13px;margin:4px 0 14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.btn{font:inherit;cursor:pointer;border:1px solid #496257;background:#10231b;color:#fff;border-radius:10px;padding:9px 12px}.primary{background:#087f5b;border-color:#087f5b}
.card{background:#101d18;border:1px solid #294138;border-radius:16px;padding:14px;margin:10px 0}.monthbar{display:flex;align-items:center;justify-content:space-between}.monthtitle{font-weight:700;font-size:18px}.nav{width:42px;height:42px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}.dow{text-align:center;color:#91a39a;font-size:11px;padding:4px}.date{min-height:62px;border:1px solid #294138;background:#0e1b16;border-radius:9px;padding:7px;position:relative;cursor:pointer}.date.empty{opacity:.2}.date.today{outline:2px solid #0b8f68}.date.selected{background:#123b2d;border-color:#0b8f68}.date .num{font-weight:700}.date .type{font-size:10px;color:#9ddcc3;margin-top:5px}.date.done:after{content:"✓";position:absolute;right:6px;bottom:4px;color:#79e0b5;font-size:17px;font-weight:800}
.row{display:flex;align-items:center;gap:11px}.grow{flex:1}.name{font-weight:700;font-size:15px}.meta{color:#aeb9b3;font-size:12px;margin-top:4px}.rec{color:#8fe0bd;font-size:12px;margin-top:4px}
input[type=number],input[type=text]{background:#07110d;color:#fff;border:1px solid #496257;border-radius:8px;padding:8px}input[type=number]{width:72px}input[type=checkbox]{width:21px;height:21px;accent-color:#0b8f68}
.history{max-height:340px;overflow:auto}.historyrow{display:flex;justify-content:space-between;border-bottom:1px solid #263a32;padding:9px 0;font-size:13px}.muted{color:#aeb9b3}.green{color:#8fe0bd;font-weight:700}.hidden{display:none!important}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#0d2119;border:1px solid #294138;border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:20px;margin-top:4px}
@media print{body{background:#fff;color:#111}.no-print{display:none!important}.card{background:#fff;border:1px solid #bbb}.muted,.meta{color:#333}}
</style>
</head>
<body>
<div class="wrap">
<h1>🏋️ FTL Workout</h1>
<div class="sub">FTL Gym Pahlawan • mulai Senin, 21 September 2026 • 19.30 WIB</div>

<div class="card">
<div class="stats"><div class="stat">Workout<b id="statWorkout">0</b></div><div class="stat">Checklist<b id="statCheck">0%</b></div><div class="stat">Streak<b id="statStreak">0 🔥</b></div></div>
</div>

<div class="toolbar no-print">
<button class="btn primary" onclick="show('calendar')">📅 Workout</button>
<button class="btn" onclick="show('profile')">👤 Profile</button>
<button class="btn" onclick="window.print()">🖨️ PDF</button>
</div>

<section id="calendar">
<div class="card">
<div class="monthbar"><button class="btn nav" onclick="moveMonth(-1)">‹</button><div class="monthtitle" id="monthTitle"></div><button class="btn nav" onclick="moveMonth(1)">›</button></div>
<div class="cal" id="calendar"></div>
</div>
<div class="card"><div id="selectedTitle"></div><div id="workout"></div></div>
<div class="card"><b>📋 Riwayat</b><div class="history" id="history"></div></div>
</section>

<section id="profile" class="hidden">
<div class="card">
<b>👤 Profile</b>
<div class="meta">Nama</div><input id="pName" type="text" style="width:100%;margin-top:4px">
<div class="meta" style="margin-top:10px">Berat awal (kg)</div><input id="pStart" type="number" style="width:100%;margin-top:4px">
<div class="meta" style="margin-top:10px">Target berat (kg)</div><input id="pTarget" type="number" style="width:100%;margin-top:4px">
<button class="btn primary" style="margin-top:12px" onclick="saveProfile()">💾 Simpan</button>
</div>
<div class="card"><div class="muted">Data tersimpan di browser perangkat ini. Versi cloud per akun Google akan disambungkan pada tahap backend.</div></div>
</section>
</div>

<script>
const plans={
1:{title:"Upper Body + Cardio",items:[["Wide Chest Press",30,"3 × 8–12"],["Lat Pulldown",30,"3 × 8–12"],["Seated Row",30,"3 × 8–12"],["Shoulder Press",20,"3 × 8–12"],["Butterfly / Pec Deck",25,"2 × 12–15"],["Biceps Curl / Cable Curl",15,"2 × 10–15"],["Triceps Pushdown",20,"2 × 10–15"]],cardio:"Treadmill 20 menit — 5 menit pemanasan + 15 menit jalan cepat, incline 3–6%."},
2:{title:"Lower Body",items:[["Smith Squat",20,"3 × 8–12"],["Leg Press",60,"3 × 10–12"],["Leg Extension",20,"3 × 10–15"],["Leg Curl",20,"3 × 10–15"],["Hip Thrust Machine",30,"3 × 8–12"],["Seated Calf Raise",25,"3 × 12–15"],["Abdominal Machine",20,"3 × 12–15"]]},
3:{title:"Cardio LISS",items:[],cardio:"Treadmill 35–45 menit ATAU stationary bike / elliptical 30–45 menit. Intensitas ringan–sedang; masih bisa ngobrol."},
4:{title:"Upper Body",items:[["Incline / Chest Press",25,"3 × 8–12"],["Lat Pulldown",30,"3 × 8–12"],["Seated Cable Row",30,"3 × 8–12"],["Shoulder Press",20,"3 × 8–12"],["Butterfly / Pec Deck",25,"2 × 12–15"],["Lateral Raise",5,"3 × 12–15"],["Biceps Curl / Cable Curl",15,"2 × 10–15"],["Triceps Pushdown",20,"2 × 10–15"]],cardio:"Opsional: treadmill 10–15 menit santai."},
5:{title:"Lower Body + Cardio",items:[["Smith Squat",20,"3 × 8–10"],["Leg Press",60,"3 × 10–12"],["Hip Thrust Machine",30,"3 × 8–12"],["Leg Curl",20,"3 × 10–15"],["Leg Extension",20,"2 × 12–15"],["Calf Machine",25,"3 × 12–15"],["Abdominal Machine",20,"3 × 12–15"]],cardio:"Treadmill 15–20 menit jalan cepat."},
6:{title:"Full Body — Ringan",items:[["Chest Press",25,"2 × 10–12"],["Lat Pulldown",25,"2 × 10–12"],["Leg Press",50,"2 × 10–12"],["Seated Row",25,"2 × 10–12"],["Shoulder Press",15,"2 × 10–12"],["Leg Curl",20,"2 × 12–15"],["Abdominal Machine",20,"3 × 12–15"]],cardio:"Opsional: treadmill 15–20 menit santai."},
0:{title:"Rest & Recovery",items:[],cardio:"Istirahat. Boleh jalan santai dan stretching ringan."}};
let checks=JSON.parse(localStorage.getItem("ftl_checks")||"{}"),weights=JSON.parse(localStorage.getItem("ftl_weights")||"{}"),profile=JSON.parse(localStorage.getItem("ftl_profile")||"{}");
let selected=new Date(),view=new Date(selected.getFullYear(),selected.getMonth(),1);
const pad=n=>String(n).padStart(2,"0"),key=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fmt=d=>d.toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
function plan(d){return plans[d.getDay()]}
function save(){localStorage.setItem("ftl_checks",JSON.stringify(checks));localStorage.setItem("ftl_weights",JSON.stringify(weights));renderAll()}
function renderCal(){let y=view.getFullYear(),m=view.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),start=(first.getDay()+6)%7,h='<div class="dow">Sen</div><div class="dow">Sel</div><div class="dow">Rab</div><div class="dow">Kam</div><div class="dow">Jum</div><div class="dow">Sab</div><div class="dow">Min</div>';for(let i=0;i<start;i++)h+='<div class="date empty"></div>';for(let d=1;d<=last.getDate();d++){let x=new Date(y,m,d),k=key(x),p=plan(x),done=p.items.length&&p.items.every((_,i)=>checks[k]?.[i]);h+='<div class="date '+(key(x)==key(new Date())?'today ':'')+(key(x)==key(selected)?'selected ':'')+(done?'done':'')+'" onclick="selectDate('+d+')"><div class="num">'+d+'</div><div class="type">'+p.title+'</div></div>'}document.getElementById("calendar").innerHTML=h;document.getElementById("monthTitle").textContent=view.toLocaleDateString("id-ID",{month:"long",year:"numeric"})}
function selectDate(d){selected=new Date(view.getFullYear(),view.getMonth(),d);renderAll()}
function renderWorkout(){let k=key(selected),p=plan(selected),h='<h3 style="margin:0 0 6px">📅 '+fmt(selected)+'</h3><div class="green">'+p.title+'</div>';if(!p.items.length){h+='<p class="muted">'+(p.cardio||"Rest")+'</p>'}else{h+='<div style="margin-top:10px">';p.items.forEach((it,i)=>{let w=weights[k+"_"+i]??it[1],c=!!checks[k]?.[i];h+='<div class="row" style="padding:10px 0;border-bottom:1px solid #263a32"><input type="checkbox" '+(c?'checked':'')+' onchange="toggle('+i+',this.checked)"><div class="grow"><div class="name">'+it[0]+'</div><div class="meta">'+it[2]+'</div><div class="rec">Awal '+it[1]+' kg</div></div><input type="number" min="0" step="2.5" value="'+w+'" onchange="weight('+i+',this.value)"><span class="muted">kg</span></div>'});h+='</div>'}if(p.cardio)h+='<div class="card" style="margin-top:12px"><b>❤️ Cardio</b><div class="meta">'+p.cardio+'</div></div>';document.getElementById("selectedTitle").innerHTML="";document.getElementById("workout").innerHTML=h}
function toggle(i,v){let k=key(selected);checks[k]??={};checks[k][i]=v;save()}function weight(i,v){let k=key(selected);weights[k+"_"+i]=Number(v)||0;save()}
function renderHistory(){let keys=Object.keys(checks).sort().reverse(),h=keys.length?keys.map(k=>{let d=new Date(k+"T00:00:00"),p=plan(d),n=Object.values(checks[k]||{}).filter(Boolean).length;return '<div class="historyrow"><span><b>'+d.toLocaleDateString("id-ID")+'</b><br><span class="muted">'+p.title+'</span></span><span class="green">'+n+'/'+p.items.length+' ✓</span></div>'}).join(""):'<div class="muted" style="padding-top:10px">Belum ada riwayat.</div>';document.getElementById("history").innerHTML=h}
function renderDash(){let days=Object.keys(checks),work=days.filter(k=>Object.values(checks[k]||{}).some(Boolean)).length,total=0,done=0;days.forEach(k=>{let d=new Date(k+"T00:00:00"),n=plan(d).items.length;total+=n;done+=Object.values(checks[k]||{}).filter(Boolean).length});let dates=new Set(days.filter(k=>Object.values(checks[k]||{}).some(Boolean)));let s=0,d=new Date();while(dates.has(key(d))){s++;d.setDate(d.getDate()-1)}document.getElementById("statWorkout").textContent=work;document.getElementById("statCheck").textContent=total?Math.round(done/total*100)+"%":"0%";document.getElementById("statStreak").textContent=s+" 🔥"}
function loadProfile(){pName.value=profile.name||"";pStart.value=profile.start||"";pTarget.value=profile.target||""}function saveProfile(){profile={name:pName.value,start:Number(pStart.value)||0,target:Number(pTarget.value)||0};localStorage.setItem("ftl_profile",JSON.stringify(profile));alert("Profile tersimpan.");}
function moveMonth(n){view=new Date(view.getFullYear(),view.getMonth()+n,1);renderAll()}function show(id){calendar.classList.toggle("hidden",id!=="calendar");profileTabToggle(id==="profile")}
function profileTabToggle(v){document.getElementById("profile").classList.toggle("hidden",!v);document.getElementById("calendar").classList.toggle("hidden",v);if(v)loadProfile()}
function renderAll(){renderCal();renderWorkout();renderHistory();renderDash()}
renderAll();loadProfile();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body></html>
